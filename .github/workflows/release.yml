name: Build Tagged Release Version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Read release metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties | tail -n 1)"
          release_version="${RELEASE_TAG#v}"

          if [[ -z "$mod_id" || -z "$release_version" ]]; then
            echo "Unable to determine release metadata." >&2
            exit 1
          fi

          echo "mod_id=$mod_id" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        run: ./gradlew build -Prelease_tag="${{ github.ref_name }}"

      - name: Verify release artifact
        shell: bash
        run: |
          artifact="build/libs/${{ steps.metadata.outputs.mod_id }}-${{ steps.metadata.outputs.release_version }}.jar"
          if [[ ! -f "$artifact" ]]; then
            echo "Expected release artifact not found: $artifact" >&2
            find build/libs -maxdepth 1 -type f -printf '%f\n' | sort >&2
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanteacraft-${{ steps.metadata.outputs.release_version }}
          path: build/libs/${{ steps.metadata.outputs.mod_id }}-${{ steps.metadata.outputs.release_version }}.jar
          if-no-files-found: error
